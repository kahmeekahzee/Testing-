<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Block 1 Got Lots Or Not</title>
  <style>
    :root {
      --bg: #0b0d10;
      --card: #15181d;
      --text: #e8eaed;
      --muted: #8a9099;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    header { text-align: center; }
    h1 { font-size: 1.15rem; margin: 8px 0 2px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: .85rem; margin: 0; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }
    #status {
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -.01em;
      font-size: clamp(3rem, 16vw, 7rem);
      margin: 0;
      word-break: break-word;
    }
    #status.got { color: var(--green); }
    #status.none { color: var(--red); font-size: clamp(2.4rem, 12vw, 5.5rem); }
    #status.loading, #status.error { color: var(--muted); font-size: clamp(1.6rem, 8vw, 3rem); }
    #lots { font-size: clamp(1.4rem, 7vw, 2.4rem); font-weight: 700; color: var(--text); margin: 0; }
    #lots:empty { display: none; }
    #lots .n { color: var(--green); font-size: 1.6em; font-variant-numeric: tabular-nums; }

    footer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #checked { color: var(--muted); font-size: .9rem; margin: 0; }
    button {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
  <header>
    <h1>Block 1 Got Lots Or Not</h1>
    <p class="sub" id="dev">BH1 · BLK 1 THOMSON ROAD</p>
  </header>

  <main aria-live="polite">
    <p id="status" class="loading">Checking…</p>
    <p id="lots"></p>
  </main>

  <footer>
    <p id="checked">Last checked: —</p>
    <button id="refresh" type="button">Refresh</button>
  </footer>

  <script>
    const API = "https://sg-ev-chargers.9nhi5b.workers.dev/carpark?c=BH1";
    const REFRESH_MS = 60000;

    const $status = document.getElementById("status");
    const $lots = document.getElementById("lots");
    const $checked = document.getElementById("checked");
    const $dev = document.getElementById("dev");
    const $btn = document.getElementById("refresh");

    function formatTimestamp(ts) {
      if (ts === undefined || ts === null || ts === "") return "—";
      // Accept ISO strings, or epoch seconds / milliseconds.
      let d = typeof ts === "number" || /^\d+$/.test(String(ts))
        ? new Date(Number(ts) < 1e12 ? Number(ts) * 1000 : Number(ts))
        : new Date(ts);
      if (isNaN(d)) return String(ts);
      return d.toLocaleString("en-SG", {
        timeZone: "Asia/Singapore",
        day: "numeric", month: "short", hour: "numeric", minute: "2-digit", second: "2-digit"
      });
    }

    async function check() {
      $btn.disabled = true;
      $btn.textContent = "Refreshing…";
      try {
        const res = await fetch(API, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const lots = Number(data.AvailableLots);
        if (!Number.isFinite(lots)) throw new Error("Bad data");

        if (data.Development) $dev.textContent = (data.CarParkID || "BH1") + " · " + data.Development;

        if (lots > 0) {
          $status.className = "got";
          $status.textContent = "GOT LOTS";
          $lots.innerHTML = '<span class="n">' + lots + "</span><br>lot" + (lots === 1 ? "" : "s") + " available";
        } else {
          $status.className = "none";
          $status.textContent = "NO LOTS SIAL. GO PARK AT DUSUN";
          $lots.textContent = "";
        }
        $checked.textContent = "Last checked: " + formatTimestamp(data.timestamp);
      } catch (err) {
        $status.className = "error";
        $status.textContent = "Couldn't check lots. Try again.";
        $lots.textContent = "";
        console.error(err);
      } finally {
        $btn.disabled = false;
        $btn.textContent = "Refresh";
      }
    }

    $btn.addEventListener("click", check);
    check();
    setInterval(check, REFRESH_MS);
    // Refresh immediately when the user comes back to the tab.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") check();
    });
  </script>
</body>
</html>
